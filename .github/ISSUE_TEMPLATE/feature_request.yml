name: Feature proposal
description: Propose a scoped, safety-compatible improvement
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or maintenance problem, not only a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Domain and safety
        - Hardware abstraction
        - ESP-IDF platform
        - Mobile web controller
        - Diagnostics and OTA
        - Documentation and tooling
        - Future connectivity
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and failure behavior
      description: Explain STOP behavior, failure modes, recovery, and test coverage.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and alternatives
      description: Note hardware/software cost, alternatives, and what should remain out of scope.
    validations:
      required: true
