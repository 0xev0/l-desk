<svg xmlns="http://www.w3.org/2000/svg" width="190" height="20"
     role="img" aria-label="host tests: 100% passing">
  <title>host tests: 100% passing</title>
  <linearGradient id="s" x2="0" y2="100%">
    <stop offset="0" stop-color="#fff" stop-opacity=".18"/>
    <stop offset="1" stop-opacity=".08"/>
  </linearGradient>
  <clipPath id="r"><rect width="190" height="20" rx="3"/></clipPath>
  <g clip-path="url(#r)">
    <rect width="80" height="20" fill="#50575c"/>
    <rect x="80" width="110" height="20" fill="#18866f"/>
    <rect width="190" height="20" fill="url(#s)"/>
  </g>
  <g fill="#fff" text-anchor="middle"
     font-family="Verdana,DejaVu Sans,sans-serif" font-size="11">
    <text x="40" y="15" fill="#010101" fill-opacity=".3">host tests</text>
    <text x="40" y="14">host tests</text>
    <text x="135" y="15" fill="#010101" fill-opacity=".3">100% passing</text>
    <text x="135" y="14">100% passing</text>
  </g>
</svg>
